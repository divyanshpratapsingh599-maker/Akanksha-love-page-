<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hey Akanksha 🥰</title>
<style>
*{box-sizing:border-box}
:root{
  --pink:#ff5d91;--pink2:#ff86ad;--ink:#351b2b;--muted:#8e6577;
}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  background:
    radial-gradient(circle at 15% 15%,rgba(255,255,255,.9) 0 4%,transparent 5%),
    radial-gradient(circle at 85% 20%,rgba(255,255,255,.8) 0 3%,transparent 4%),
    linear-gradient(135deg,#fff3f8,#ffe3ed 48%,#f2e9ff);
}
body:before,body:after{
  content:"";position:fixed;border-radius:50%;filter:blur(4px);opacity:.45;pointer-events:none
}
body:before{width:260px;height:260px;background:#ffb5cf;top:-100px;left:-80px}
body:after{width:300px;height:300px;background:#d7c2ff;right:-120px;bottom:-120px}
.floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.floaters span{position:absolute;font-size:22px;opacity:.5;animation:float 7s linear infinite}
.floaters span:nth-child(1){left:8%;animation-delay:0s}
.floaters span:nth-child(2){left:25%;animation-delay:2s}
.floaters span:nth-child(3){left:65%;animation-delay:1s}
.floaters span:nth-child(4){left:88%;animation-delay:3s}
@keyframes float{from{transform:translateY(110vh) rotate(0);opacity:0}20%{opacity:.55}to{transform:translateY(-15vh) rotate(25deg);opacity:0}}

.card{
  width:min(92vw,460px);min-height:590px;padding:54px 28px 34px;
  border:1px solid rgba(255,255,255,.9);border-radius:34px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(18px);
  box-shadow:0 28px 80px rgba(123,47,86,.20),inset 0 1px rgba(255,255,255,.9);
  text-align:center;display:flex;flex-direction:column;justify-content:center;
  position:relative;overflow:hidden;
}
.card:after{content:"";position:absolute;inset:0;border-radius:34px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);pointer-events:none}
.progress{position:absolute;top:20px;left:28px;right:28px;height:7px;background:#f4dce7;border-radius:99px;overflow:hidden}
.bar{height:100%;background:linear-gradient(90deg,var(--pink),#ff9fbd);width:16%;border-radius:99px;transition:width .5s ease}
.step{position:absolute;top:31px;right:29px;font-size:11px;font-weight:800;color:#a66b84;letter-spacing:.5px}
.content{animation:enter .45s ease}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.heart{
  width:92px;height:92px;margin:0 auto 10px;border-radius:28px;
  display:grid;place-items:center;font-size:50px;
  background:linear-gradient(145deg,#fff,#fff0f5);
  box-shadow:0 12px 30px rgba(255,93,145,.16);
  animation:beat 1.35s ease-in-out infinite;
}
@keyframes beat{50%{transform:scale(1.06)}}
.small{color:#a06d83;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.question{font-size:clamp(25px,7vw,32px);font-weight:800;line-height:1.18;margin:16px auto 12px;max-width:390px}
.note{font-size:15px;line-height:1.55;color:var(--muted);max-width:360px;margin:0 auto 25px}
.buttons{display:flex;gap:12px;justify-content:center;align-items:center;min-height:58px;position:relative}
.btn{
  border:0;border-radius:16px;padding:14px 24px;font-size:16px;font-weight:800;
  cursor:pointer;transition:transform .2s,box-shadow .2s;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.95)}
.yes{color:white;background:linear-gradient(135deg,#ff4f89,#ff7ba4);box-shadow:0 12px 24px rgba(255,79,137,.25)}
.no{background:rgba(255,255,255,.9);color:#8a536b;border:1px solid #f0cad8;box-shadow:0 8px 20px rgba(100,40,80,.08)}
.btn:hover{transform:translateY(-2px)}
.footer{margin-top:25px;font-size:11px;color:#b18a9b}
.hidden{display:none}
@media(max-height:700px){.card{min-height:520px;padding-top:48px}.heart{width:76px;height:76px;font-size:42px}.question{font-size:25px}.note{margin-bottom:16px}}

.shake{animation:prankShake .42s ease-in-out}
@keyframes prankShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-10px)}
  40%{transform:translateX(10px)}
  60%{transform:translateX(-8px)}
  80%{transform:translateX(8px)}
}
</style>
</head>
<body>
<div class="floaters"><span>♡</span><span>✦</span><span>♡</span><span>✧</span></div>
<main class="card">
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="step" id="step"></div>
  <div id="app"></div>
  <div class="footer">made with a little courage & lots of good vibes ✨</div>
</main>

<script>
const steps=[
 ['🥰','Hey Akanksha 🥰','Welcome page… I have a few things to ask you 😁'],
 ['😁','How are u Basantii ?? 😁','Hope you’re doing good!'],
 ['💖','Princi I wanna ask from the deapth of my heart❤ , Do u love me ??💖🤗😭','Okay… this one is important 👀'],
 ['🥀','Do u wanna be mine ??🤗','No pressure — just answer honestly 🥀😭'],
 ['🌸',"Can we meet together if you don't mind ....🥀😭",'Maybe a little coffee/walk and a lot of talking?'],
 ['❤️','One last thing…','Whatever your answer, thank you for reading this ❤️']
];

let i=0;
const app=document.getElementById('app'),bar=document.getElementById('bar'),step=document.getElementById('step');

function render(){
 const [emoji,q,n]=steps[i];
 bar.style.width=((i+1)/steps.length*100)+'%';
 step.textContent=`${i+1} / ${steps.length}`;
 app.innerHTML=`
   <div class="content">
     <div class="heart">${emoji}</div>
     <div class="small">A tiny message for you</div>
     <div class="question">${q}</div>
     <div class="note">${n}</div>
     <div class="buttons">
       ${i<steps.length-1
        ? `<button class="btn yes" id="yes">Yes 💖</button><button class="btn no" id="no">No 🙈</button>`
        : `<button class="btn yes" id="finish">❤️ I read it</button>`}
     </div>
   </div>`;

 if(i<steps.length-1){
   document.getElementById('yes').onclick=()=>{i++;render()};
   document.getElementById('no').onclick=()=>{
  const card=document.querySelector('.card');
  card.classList.remove('shake');
  void card.offsetWidth;
  card.classList.add('shake');
  if(navigator.vibrate) navigator.vibrate([100,50,100,50,160]);
  const no=document.getElementById('no');
  const oldText=no.textContent;
  no.textContent='Nice try 😜';
  setTimeout(()=>{no.textContent=oldText},700);
};
 }else{
   document.getElementById('finish').onclick=()=>{
     app.innerHTML=`<div class="content">
       <div class="heart">💗</div>
       <div class="small">Message received</div>
       <div class="question">Thank you, Akanksha 🥰</div>
       <div class="note">Whatever happens, I hope you keep smiling.</div>
     </div>`;
     bar.style.width='100%';step.textContent='✓';
   };
 }
}
render();
</script>
</body>
</html>
